<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Zone - تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="particles" id="particles"></div>
    
    <div class="login-container">
        <div class="login-logo">
            <div class="logo-icon">
                <i class="fas fa-gamepad"></i>
            </div>
            <h1>GAMING <span class="neon-text">ZONE</span></h1>
            <p class="login-subtitle">نظام إدارة الصالة</p>
        </div>
        
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <select id="loginRole" required>
                    <option value="">اختر الحساب</option>
                    <option value="owner">👑 المالك</option>
                    <option value="morning">🌅 عامل الصباح</option>
                    <option value="evening">🌙 عامل المساء</option>
                </select>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="كلمة المرور" required>
            </div>
            
            <button type="submit" class="btn-login">
                <span>دخول</span>
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <div class="login-hint">
                <small>🔑 كلمات المرور الافتراضية: owner123 / morning123 / evening123</small>
            </div>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        // Particles animation
        const particlesContainer = document.getElementById('particles');
        for(let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
            particlesContainer.appendChild(particle);
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const password = document.getElementById('loginPassword').value;
            
            const passwords = {
                owner: 'owner123',
                morning: 'morning123',
                evening: 'evening123'
            };

            if(passwords[role] && passwords[role] === password) {
                localStorage.setItem('currentUser', role);
                localStorage.setItem('loginTime', new Date().toISOString());
                window.location.href = 'dashboard.html';
            } else {
                showNotification('كلمة المرور غير صحيحة!', 'error');
            }
        });
    </script>
</body>
</html>
